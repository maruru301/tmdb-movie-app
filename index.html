<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Goorm TV</title>
        <link rel="stylesheet" href="css/styles.css" />
    </head>

    <body>
        <!-- header -->
        <header id="header">
            <h1 id="logo">
                <a href="index.html">Goorm TV</a>
            </h1>

            <section id="search-bar">
                <input id="search-input" type="text" placeholder="영화 검색" />
                <button id="search-btn"><img src="assets/icon-search.svg" alt="검색 아이콘" /></button>
            </section>
        </header>

        <!-- main -->
        <main id="main">
            <section class="card-container">
                <h2>👑 Top Rated Movie</h2>
                <div class="card-list"></div>
            </section>
        </main>

        <section class="modal hidden">
            <div class="modal-box">
                <div class="modal-content">
                    <h3>제목</h3>
                    <p>내용</p>
                </div>
                <button class="modal-close">x</button>
            </div>
        </section>

        <!-- footer -->
        <footer></footer>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
